name: Dependency checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m venv /tmp/security-check-env
      - run: /tmp/security-check-env/bin/python -m pip install -r requirements.full.txt -r requirements.txt
      - run: /tmp/security-check-env/bin/python -m pip check
      - run: /tmp/security-check-env/bin/python -m unittest discover -s tests -v
      - run: /tmp/security-check-env/bin/python -m pip install pip-audit
      - run: /tmp/security-check-env/bin/python -m pip_audit -r requirements.full.txt
      - run: /tmp/security-check-env/bin/python -m pip_audit -r requirements.txt
